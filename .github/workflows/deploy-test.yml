# Deploy Sunset Page to Test Namespace
# Builds and deploys a simple static HTML sunset page to the OpenShift test environment.
name: Deploy Sunset to Test

on:
  # Trigger manually via GitHub Actions UI or on push to sunset branch
  workflow_dispatch:
  push:
    branches:
      - sunset

jobs:
  # Print variables for logging and debugging purposes
  checkEnv:
    name: Check Env variables
    runs-on: ubuntu-latest
    steps:
      - name: Print Env Vars
        run: |
          echo Git Base Ref: ${{ github.base_ref }}
          echo Git Build ID: ${{ github.event.number }}
          echo Git Pull Request Ref: ${{ github.event.pull_request.head.sha }}

  # Build the static sunset page
  build:
    name: Build Sunset Page
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ github.event.number }}
      BUILD_NAMESPACE: a58ce1-tools
      BRANCH: ${{ github.ref_name }}
      BUILD_TAG: latest
      APP: learningcurator-sunset
    steps:
      - name: Print env
        run: |
          echo BUILD ID: $BUILD_ID
          echo BUILD NAMESPACE: $BUILD_NAMESPACE
          echo BRANCH: $BRANCH
      - name: Checkout Target Branch
        uses: actions/checkout@v4
      - name: Install oc
        uses: redhat-actions/oc-installer@v1
        with:
          oc_version: '4.12'
      # Log in to OpenShift
      - name: Log in to OpenShift
        run: |
          oc login --token=${{ secrets.SA_TOKEN }} --server=https://api.silver.devops.gov.bc.ca:6443
      # Build the sunset page image
      - name: Build Sunset Page image
        working-directory: "./openshift/sunset"
        run: |
          test -n "${BRANCH}"
          test -n "${BUILD_NAMESPACE}"
          echo "BUILDING ${APP} with tag: ${BUILD_TAG}"
          oc -n ${BUILD_NAMESPACE} process -f docker-build.yml \
            -p TAG=${BUILD_TAG} -p SOURCE_REPOSITORY_REF=${BRANCH} \
            -p SOURCE_CONTEXT_DIR=sunset \
            -p NAME=${APP} | oc -n ${BUILD_NAMESPACE} apply -f -
          oc -n ${BUILD_NAMESPACE} start-build bc/${APP} --no-cache --wait

  # Deploy Sunset Page to Test environment
  deployTest:
    name: Deploy Sunset Page to Test environment
    runs-on: ubuntu-latest
    env:
      BUILD_ID: ${{ github.event.number }}
      NAMESPACE: a58ce1-test
      BUILD_NAMESPACE: a58ce1-tools
      BRANCH: ${{ github.ref_name }}
      APP: learningcurator-sunset
      APP_HOST: learningcurator-sunset-a58ce1-test.apps.silver.devops.gov.bc.ca
    needs:
      - build
    steps:
      - name: Checkout Target Branch
        uses: actions/checkout@v4
      - name: Install oc
        uses: redhat-actions/oc-installer@v1
        with:
          oc_version: '4.12'

      # Log in to OpenShift
      - name: Log in to OpenShift
        run: |
          oc login --token=${{ secrets.SA_TOKEN }} --server=https://api.silver.devops.gov.bc.ca:6443
      - name: Deploy Sunset Page
        run: |
          test -n "${NAMESPACE}"
          test -n "${BUILD_NAMESPACE}"
          test -n "${BRANCH}"
          echo "Current namespace is ${NAMESPACE}"
          oc -n ${BUILD_NAMESPACE} policy add-role-to-group system:image-puller system:serviceaccounts:${NAMESPACE}
          oc -n ${NAMESPACE} process -f openshift/sunset/sunset-template.json \
                -p APP_NAME=${APP} \
                -p SITE_URL=${APP_HOST} \
                -p PROJECT_NAMESPACE=${NAMESPACE} \
                -p BUILD_NAMESPACE=${BUILD_NAMESPACE} \
                -p IMAGE_STREAM_TAG="${APP}:latest" | \
          oc -n ${NAMESPACE} apply -f -
          sleep 30
          oc rollout latest dc/${APP} -n ${NAMESPACE}
          # Check deployment rollout status every 10 seconds (max 10 minutes) until complete.
          ATTEMPTS=0
          ROLLOUT_STATUS_CMD="oc rollout status dc/${APP} -n ${NAMESPACE}"
          until $ROLLOUT_STATUS_CMD || [ $ATTEMPTS -eq 60 ]; do
            $ROLLOUT_STATUS_CMD
            ATTEMPTS=$((attempts + 1))
            sleep 10
          done
          oc project ${NAMESPACE}
          echo "Listing pods.."
          oc get pods|grep ${APP}
          export ROUTE="$(oc get route ${APP} -o jsonpath='{.spec.host}')"
          echo "${APP} is exposed at 'https://'${ROUTE}"
