<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Curator - We've Moved</title>
    <style>
        :root {
            --primary-color: #003366;
            --text-color: #313132;
            --background-light: #f8f9fa;
            --border-color: #dee2e6;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary-color: #4a90e2;
                --text-color: #e9ecef;
                --background-light: #212529;
                --border-color: #495057;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--background-light);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 600px;
            background: var(--background-light);
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        p {
            margin-bottom: 1rem;
            font-size: 1.125rem;
        }

        .message {
            margin-top: 2rem;
            padding: 1rem;
            background: var(--border-color);
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.5rem;
            }

            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <main class="container" role="main">
        <h1>Learning Curator</h1>
        <p>We're sorry, but this service has moved.</p>
        <div class="message">
            <p>Thank you for your interest in Learning Curator. This application is no longer available at this location.</p>
        </div>
    </main>
</body>
</html>
